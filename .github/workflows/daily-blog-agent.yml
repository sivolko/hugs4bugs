name: Daily Threat Intel Blog Agent

on:
  schedule:
    # 06:00 UTC = 11:30 AM IST — runs every day after morning news cycle
    - cron: '0 6 * * *'
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions tab anytime

permissions:
  contents: write   # Required to commit drafts to _drafts/ in this same repo

jobs:
  run-agent:
    name: Generate and publish threat intel roundup
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout blog + agent repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: agent/requirements.txt

      - name: Install dependencies
        working-directory: agent
        run: pip install -r requirements.txt

      - name: Run threat intel blog agent
        working-directory: agent
        env:
          # Anthropic Claude — add this as a repo secret
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

          # Built-in token — no separate PAT needed since agent lives in the blog repo
          BLOG_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BLOG_GITHUB_REPO: ${{ github.repository }}

          # Email notification
          EMAIL_TO: shubhendushubham98@gmail.com
          EMAIL_FROM: shubhendushubham98@gmail.com
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}

          # Agent behaviour
          LOOKBACK_HOURS: "24"
          MAX_STORIES: "5"
          CLAUDE_MODEL: claude-sonnet-4-5
          BLOG_BRANCH: main
          DRAFTS_PATH: _drafts
        run: python main.py

      - name: Upload run log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: agent-failure-log-${{ github.run_id }}
          path: agent/logs/
          if-no-files-found: ignore
